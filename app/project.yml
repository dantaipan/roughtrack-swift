name: RoughTrackSwift
options:
  bundleIdPrefix: com.danmullins
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  RoughTrackSwift:
    type: application
    platform: macOS
    sources:
      - path: RoughTrackSwift
        excludes:
          - Entitlements.plist
      - path: ../resources/drums
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "RoughTrack"
        PRODUCT_BUNDLE_IDENTIFIER: com.danmullins.roughtrack
        MARKETING_VERSION: 0.1.9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "RoughTrack"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "RoughTrack records from your audio interface inputs."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Dan Mullins. Free software under the GNU AGPL 3.0 or later."

        # Plugin hosting needs Hardened Runtime with these entitlements, and a stable
        # identity keeps the microphone permission from being asked for again each build.
        CODE_SIGN_ENTITLEMENTS: RoughTrackSwift/Entitlements.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: FBXF9AT7JJ

        # Swift calls the C++ core through core/bridge/RoughTrackCore.h.
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../core/bridge

        # The engine, core and JUCE come from the CMake build (see the pre-build script).
        # NAM's model types register themselves, so its archive is loaded whole.
        ROUGHTRACK_CMAKE_BUILD: $(SRCROOT)/../build/release
        OTHER_LDFLAGS:
          - $(ROUGHTRACK_CMAKE_BUILD)/core/libroughtrack_core.a
          - $(ROUGHTRACK_CMAKE_BUILD)/engine/libroughtrack_engine.a
          - -force_load
          - $(ROUGHTRACK_CMAKE_BUILD)/libroughtrack_nam.a
          - $(ROUGHTRACK_CMAKE_BUILD)/libroughtrack_t3k.a
          - $(ROUGHTRACK_CMAKE_BUILD)/libroughtrack_juce.a
          - -lc++

        # Debug builds would otherwise put the code in a separate .debug.dylib, and JUCE
        # takes that for the executable, so plugin scans would launch the dylib.
        ENABLE_DEBUG_DYLIB: NO

        # Apple Silicon only, by choice: there are no Intel builds.
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: AudioUnit.framework
      - sdk: AVFoundation.framework
      - sdk: Cocoa.framework
      - sdk: CoreAudio.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreText.framework
      - sdk: DiscRecording.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - name: Build the engine and core (CMake)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/.."
          if [ ! -f build/release/build.ninja ]; then cmake --preset release; fi
          cmake --build --preset release --target roughtrack_core
